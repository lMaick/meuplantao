orca_dir = "%LOCALAPPDATA%/Programs/orca"
gh_executable = ""
github_repo = "<OWNER>/<REPOSITORY>"
repo_name = "meuplantao"
repo_path = "C:/work/meuplantao"
worktree_root = "C:/workspaces/meuplantao"
linear_workspace_id = "<LINEAR_WORKSPACE_ID>"
team = "MaickAgent"
project = "MeuPlantao — Operação"
ready_label = "Orca Ready"
review_label = "Needs Review"
max_dispatch_per_run = 1
scheduler_task_name = "Hermes-MeuPlantao-Dispatcher"
# orca_settings_path: CHAVE RAIZ (top-level, MAI-81) com um PIN opcional do
# arquivo autoritativo do Orca. Deve ficar nesta secao raiz, antes de qualquer
# [[allowed_workers]]: chave solta depois das tabelas pertenceria a ultima
# entrada e NAO seria lida. Vazio = descoberta autoritativa automatica do
# `orca-data.json` do perfil ativo (`%APPDATA%/Orca/profiles/<perfil>/orca-data.json`,
# legado `%APPDATA%/Orca/orca-data.json`, via `orca-profile-index.json`).
# Se preenchido, PRECISA ser exatamente o arquivo autoritativo descoberto; pin
# divergente (snapshot/caminho arbitrario ou stale) falha fechado como
# "not authoritative" e nunca sobrepoe a autoridade do perfil ativo.
# Tambem aceita a env MEUPLANTAO_ORCA_SETTINGS (precedencia maior que a chave).
# Exemplo: orca_settings_path = "C:/Users/<VOCE>/AppData/Roaming/Orca/profiles/<perfil>/orca-data.json"
orca_settings_path = ""
# Worker policy (MAI-67): preflight autoriza e executa SOMENTE o worker de
# worker_id. Sem worker_id, sem [[allowed_workers]] ou com lista vazia, o
# dispatch falha fechado antes de criar workspace/agente ou alterar a Linear.
# Sem credenciais neste arquivo.
worker_id = "codex-luna"

# agent: id conhecido do Orca para `worktree create --agent` (confirmado via
# `orca worktree create --help`; hoje apenas codex/claude sao documentados).
# OMITA agent quando nao existir id conhecido: o worktree e criado sem
# --agent/--prompt e o agente sobe via `terminal create --command`.
# command: comando real de `terminal create --command` (ex.: codex, opencode).
# identity: agentIdentity esperado em `orca terminal list`; confira na maquina
# (nao invente: divergencia falha fechado). Comparacao exata, sem log secreto.
# auth_mode: requisito de autenticacao declarado; ausente/divergente falha
# fechado e nunca e exibido/logado.
[[allowed_workers]]
id = "codex-luna"
agent = "codex"
model = "gpt-5.6-luna"
reasoning = "low"
command = "codex"
identity = "codex"
auth_mode = "chatgpt"

[[allowed_workers]]
id = "opencode-spark"
model = "muse-spark-1.3-contributor"
reasoning = "medium"
provider = "opencode-go"
command = "opencode"
identity = "opencode"
auth_mode = "opencode"

# MAI-81 rota efetiva do wrapper Codex no Orca: `worktree create --agent codex`
# resolve o wrapper `settings.agentCmdOverrides.codex` para
# muse-spark-1.3-contributor via opencode-go com effort high, MAIS
# `settings.agentDefaultArgs.codex` anexado ao comando executado (o default
# embutido do Orca para codex e `--dangerously-bypass-approvals-and-sandbox`,
# que seria anexado ao executavel opencode: por isso o contrato operacional
# exige `agentDefaultArgs = { codex = "" }` e `agentDefaultEnv.codex`
# ausente/vazio). (`terminal create
# --command codex` repassa o comando literalmente ao runtime e NAO aplica
# agentCmdOverrides, por isso nao e rota agent-aware.) O preflight valida a rota
# efetiva inteira do wrapper (executavel + modelo/provider/reasoning exatos, sem
# tokens extras, fail-closed) e ignora o ~/.codex/config.toml divergente
# (gpt-5.6-sol low) para este worker.
# Para operar nesta rota, ajuste worker_id para "codex-spark" e aponte
# orca_settings_path (ou MEUPLANTAO_ORCA_SETTINGS) para o settings.json do Orca.
# Wrapper ausente, fonte nao autoritativa, default args/env nao vazio,
# comando nao resolvido,
# quoting/override ambiguo (incl. `agentCmdOverrides` top-level, que o Orca nao
# executa), campo ausente, modelo/provider/reasoning divergente,
# token/operador de shell ou flag desconhecida, ou conteudo malformado falha
# fechado antes de qualquer workspace/agente ou mutacao Linear. Sem credenciais neste arquivo;
# o settings operacional real nunca e commitado nem usado nos testes.
[[allowed_workers]]
id = "codex-spark"
agent = "codex"
model = "muse-spark-1.3-contributor"
provider = "opencode-go"
reasoning = "high"
command = "codex"
identity = "codex"
auth_mode = "opencode"
wrapper_executable = "opencode"

dispatch_timeout_seconds = 900
timeout_label = "Dispatch Timeout"
# MAI-69 Linear bus: the dispatcher is mechanical Python with no LLM calls for
# polling, claim, lock, dedup, timeout or notify. worker_id only selects which
# worker Orca starts. Linear outcomes are processed first each tick, before any
# worker/terminal dependency; monitor stays fail-closed on worker preflight.
# Hermes transport: durable Linear comment carrying a strict JSON payload with
# exactly {issue, event} (deduped per fingerprint, recorded only after a confirmed
# post, retried on failure; delivery reconciles from a remote read-back so a crash
# between remote accept and local save never duplicates the event) plus a read-only
# --hermes-precheck gate listing emitted events still missing `MeuPlantao-Ack:
# <fingerprint>` with the Linear-derivable expectedAck (exit 0 pending / 1 quiet;
# unreachable Linear is fail-closed pending) for the operator-owned Orca automation
# actuator, which is created by the owner and never by this PR. The
# labels Orca Ready, Needs Review and Dispatch Timeout must exist in Linear.
# The worker reports conclusion/error via a `MeuPlantao-Report:` Linear comment;
# review discovery is exclusively Linear, gh only verifies a reported PR.
