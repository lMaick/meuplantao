orca_dir = "%LOCALAPPDATA%/Programs/orca"
gh_executable = ""
github_repo = "<OWNER>/<REPOSITORY>"
repo_name = "meuplantao"
repo_path = "C:/work/meuplantao"
worktree_root = "C:/workspaces/meuplantao"
linear_workspace_id = "<LINEAR_WORKSPACE_ID>"
team = "MaickAgent"
project = "MeuPlantao — Operação"
ready_label = "Orca Ready"
review_label = "Needs Review"
max_dispatch_per_run = 1
scheduler_task_name = "Hermes-MeuPlantao-Dispatcher"

# Worker policy (MAI-67): preflight autoriza somente os workers declarados aqui.
# Sem [[allowed_workers]] ou com lista vazia, o dispatch falha fechado antes de
# criar workspace/agente ou alterar a Linear. Sem credenciais neste arquivo.
[[allowed_workers]]
id = "codex-luna"
agent = "codex"
model = "gpt-5.6-luna"
reasoning = "low"
auth_mode = "chatgpt"

[[allowed_workers]]
id = "opencode-spark"
agent = "opencode-go"
model = "muse-spark-1.3-contributor"
reasoning = "medium"
provider = "opencode-go"
