name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-test-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  dispatcher-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s ops/meuplantao-dispatcher -p "test_*.py" -v

  security-invariants-e2e:
    name: PostgreSQL Security Invariants E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECURITY_REAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SECURITY_REAL_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # REQUIRE_DB=1: o job falha (nunca skipa) se o PostgreSQL não subir.
      # O safety guard do teste só aceita host local — nunca Supabase remoto.
      - run: npm run test:security-real

  real-e2e:
    name: Supabase real E2E
    runs-on: ubuntu-latest
    env:
      RUN_REAL_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start isolated local Supabase
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'npx --yes supabase@2.117.0 stop --no-backup >/dev/null 2>&1 || true' EXIT

          npx --yes supabase@2.117.0 --version
          npx --yes supabase@2.117.0 init --force >/dev/null
          migration_first="supabase/migrations/20260908193728_financial_obligation_consistency.sql"
          migration_second="supabase/migrations/20260909180000_obligation_immutability.sql"
          migration_third="supabase/migrations/20260909190000_financial_authority_definer.sql"
          migration_fourth="supabase/migrations/20260909200000_financial_authority_table_privileges.sql"
          mkdir -p "${RUNNER_TEMP}/post_legacy_migrations"
          for f in supabase/migrations/20260908* supabase/migrations/20260909* supabase/migrations/20260919* supabase/migrations/20260920* supabase/migrations/20260928*; do
            if [ -f "$f" ]; then
              mv "$f" "${RUNNER_TEMP}/post_legacy_migrations/"
            fi
          done
          restore_migration() { if [ -d "${RUNNER_TEMP}/post_legacy_migrations" ]; then mv "${RUNNER_TEMP}/post_legacy_migrations/"* supabase/migrations/ 2>/dev/null || true; fi; }
          trap 'restore_migration; npx --yes supabase@2.117.0 stop --no-backup >/dev/null 2>&1 || true' EXIT
          npx --yes supabase@2.117.0 start >/dev/null

          status_file="${RUNNER_TEMP}/supabase-status.env"
          npx --yes supabase@2.117.0 status -o env >"${status_file}"
          set -a
          # The status file is redirected and sourced only in-process; its values
          # are masked before any later command can echo an environment summary.
          source "${status_file}"
          set +a
          : "${API_URL:?Supabase local API URL missing}"
          : "${ANON_KEY:?Supabase local anon key missing}"
          : "${SERVICE_ROLE_KEY:?Supabase local service-role key missing}"
          : "${DB_URL:?Supabase local database URL missing}"
          printf '::add-mask::%s\n' "${API_URL}" "${ANON_KEY}" "${SERVICE_ROLE_KEY}"
          printf '::add-mask::%s\n' "${DB_URL}"
          export DATABASE_URL="${DB_URL}"
          restore_migration
          bash tests/financial-migration-upgrade-real.sh "${migration_first}" "${migration_second}" "${migration_third}" "${migration_fourth}"
          npx --yes supabase@2.117.0 db reset --local --no-seed
          bash tests/subscription-entitlement-real.sh "supabase/migrations/20260920120000_subscription_entitlement_boundary.sql"
          bash tests/shifts-direct-write-prohibition-real.sh "supabase/migrations/20260920140000_shifts_direct_write_prohibition.sql"
          npx --yes supabase@2.117.0 db reset --local --no-seed
          export NEXT_PUBLIC_SUPABASE_URL="${API_URL}"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="${ANON_KEY}"
          NEXT_PUBLIC_SUPABASE_URL="${API_URL}" NEXT_PUBLIC_SUPABASE_ANON_KEY="${ANON_KEY}" SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY}" DATABASE_URL="${DB_URL}" node scripts/smoke-test-schema.mjs

          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(openssl rand -hex 6)"
          export E2E_USER_A_EMAIL="e2e-a-${suffix}@example.test"
          export E2E_USER_B_EMAIL="e2e-b-${suffix}@example.test"
          export E2E_USER_A_PASSWORD="$(openssl rand -hex 24)"
          export E2E_USER_B_PASSWORD="$(openssl rand -hex 24)"
          printf '::add-mask::%s\n' "${E2E_USER_A_EMAIL}" "${E2E_USER_B_EMAIL}" "${E2E_USER_A_PASSWORD}" "${E2E_USER_B_PASSWORD}"

          create_user() {
            local email="$1" password="$2" response_file
            response_file="${RUNNER_TEMP}/supabase-user-${RANDOM}.json"
            curl --fail-with-body --silent --show-error \
              --output "${response_file}" \
              -X POST "${API_URL}/auth/v1/admin/users" \
              -H "apikey: ${SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SERVICE_ROLE_KEY}" \
              -H 'Content-Type: application/json' \
              --data "$(jq -cn --arg email "${email}" --arg password "${password}" '{email:$email,password:$password,email_confirm:true}')"
            jq -e '.id and .email' "${response_file}" >/dev/null
            rm -f "${response_file}"
          }
          create_user "${E2E_USER_A_EMAIL}" "${E2E_USER_A_PASSWORD}"
          create_user "${E2E_USER_B_EMAIL}" "${E2E_USER_B_PASSWORD}"

          export RUN_REAL_E2E NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY
          export E2E_USER_A_EMAIL E2E_USER_A_PASSWORD E2E_USER_B_EMAIL E2E_USER_B_PASSWORD
          npm run test:real

  subscription-payment-real-e2e:
    name: Supabase Subscription Payment E2E
    runs-on: ubuntu-latest
    env:
      RUN_REAL_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start isolated local Supabase and run subscription payment E2E
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'npx --yes supabase@2.117.0 stop --no-backup >/dev/null 2>&1 || true' EXIT

          npx --yes supabase@2.117.0 --version
          npx --yes supabase@2.117.0 init --force >/dev/null
          npx --yes supabase@2.117.0 start >/dev/null

          status_file="${RUNNER_TEMP}/supabase-sub-status.env"
          npx --yes supabase@2.117.0 status -o env >"${status_file}"
          set -a
          # The status file is redirected and sourced only in-process; its values
          # are masked before any later command can echo an environment summary.
          source "${status_file}"
          set +a
          : "${API_URL:?Supabase local API URL missing}"
          : "${SERVICE_ROLE_KEY:?Supabase local service-role key missing}"
          : "${DB_URL:?Supabase local database URL missing}"
          printf '::add-mask::%s\n' "${API_URL}" "${SERVICE_ROLE_KEY}"
          printf '::add-mask::%s\n' "${DB_URL}"

          export NEXT_PUBLIC_SUPABASE_URL="${API_URL}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY}"
          export DATABASE_URL="${DB_URL}"

          RUN_REAL_E2E=1 \
            NEXT_PUBLIC_SUPABASE_URL="${API_URL}" \
            SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY}" \
            DATABASE_URL="${DB_URL}" \
            npm run test:subscription-real

          RUN_REAL_E2E=1 \
            NEXT_PUBLIC_SUPABASE_URL="${API_URL}" \
            SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY}" \
            DATABASE_URL="${DB_URL}" \
            npm run test:subscription-reversal-real
