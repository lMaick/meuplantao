name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-test-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  dispatcher-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s ops/meuplantao-dispatcher -p "test_*.py" -v

  real-e2e:
    name: Supabase real E2E
    runs-on: ubuntu-latest
    env:
      RUN_REAL_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start isolated local Supabase
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'npx --yes supabase@2.117.0 stop --no-backup >/dev/null 2>&1 || true' EXIT

          npx --yes supabase@2.117.0 --version
          npx --yes supabase@2.117.0 init --force >/dev/null
          npx --yes supabase@2.117.0 start >/dev/null
          npx --yes supabase@2.117.0 db reset --local --no-seed >/dev/null

          status_file="${RUNNER_TEMP}/supabase-status.env"
          npx --yes supabase@2.117.0 status -o env >"${status_file}"
          set -a
          # The status file is redirected and sourced only in-process; its values
          # are masked before any later command can echo an environment summary.
          source "${status_file}"
          set +a
          : "${API_URL:?Supabase local API URL missing}"
          : "${ANON_KEY:?Supabase local anon key missing}"
          : "${SERVICE_ROLE_KEY:?Supabase local service-role key missing}"
          printf '::add-mask::%s\n' "${API_URL}" "${ANON_KEY}" "${SERVICE_ROLE_KEY}"
          export NEXT_PUBLIC_SUPABASE_URL="${API_URL}"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="${ANON_KEY}"

          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(openssl rand -hex 6)"
          export E2E_USER_A_EMAIL="e2e-a-${suffix}@example.test"
          export E2E_USER_B_EMAIL="e2e-b-${suffix}@example.test"
          export E2E_USER_A_PASSWORD="$(openssl rand -hex 24)"
          export E2E_USER_B_PASSWORD="$(openssl rand -hex 24)"
          printf '::add-mask::%s\n' "${E2E_USER_A_EMAIL}" "${E2E_USER_B_EMAIL}" "${E2E_USER_A_PASSWORD}" "${E2E_USER_B_PASSWORD}"

          create_user() {
            local email="$1" password="$2" response_file
            response_file="${RUNNER_TEMP}/supabase-user-${RANDOM}.json"
            curl --fail-with-body --silent --show-error \
              --output "${response_file}" \
              -X POST "${API_URL}/auth/v1/admin/users" \
              -H "apikey: ${SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SERVICE_ROLE_KEY}" \
              -H 'Content-Type: application/json' \
              --data "$(jq -cn --arg email "${email}" --arg password "${password}" '{email:$email,password:$password,email_confirm:true}')"
            jq -e '.id and .email' "${response_file}" >/dev/null
            rm -f "${response_file}"
          }
          create_user "${E2E_USER_A_EMAIL}" "${E2E_USER_A_PASSWORD}"
          create_user "${E2E_USER_B_EMAIL}" "${E2E_USER_B_PASSWORD}"

          export RUN_REAL_E2E NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY
          export E2E_USER_A_EMAIL E2E_USER_A_PASSWORD E2E_USER_B_EMAIL E2E_USER_B_PASSWORD
          npm run test:real
